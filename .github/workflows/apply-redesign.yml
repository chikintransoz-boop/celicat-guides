name: Apply guide redesign
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-redesign.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject enhancement into decrypted archive
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='document.open();document.write(new TextDecoder().decode(plain));document.close();'
          new="const html=new TextDecoder().decode(plain);document.open();document.write(html.replace('</body>','<script src=\"enhance.js\"></'+'script></body>'));document.close();"
          if old not in s:
              raise SystemExit('Target line not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Enable carousel redesign after login"
          git push
