  const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:bytes(iv)},key,bytes(payload));
  sessionStorage.setItem("celicat_access",password);
  document.open();document.write(new TextDecoder().decode(plain));document.close();
}
const form=document.getElementById("login"),error=document.getElementById("error"),saved=sessionStorage.getItem("celicat_access");
if(saved)openArchive(saved).catch(()=>sessionStorage.removeItem("celicat_access"));
form.addEventListener("submit",async event=>{event.preventDefault();error.style.display="none";try{await openArchive(form.password.value)}catch{error.style.display="block";form.password.select()}});
